name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: true
        type: string

env:
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! npx semver "$VERSION"; then
            echo "Error: Invalid semver version: $VERSION"
            exit 1
          fi

      - name: Check tag doesn't exist
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Error: Tag v$VERSION already exists"
            exit 1
          fi

      - name: Check on main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Error: Releases must be from main branch"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            name: lmv-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            name: lmv-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            name: lmv-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            name: lmv-linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          mkdir -p dist
          bun build src/cli.ts --compile --target=${{ matrix.target }} --outfile=dist/${{ matrix.name }}

      - name: Create archive
        run: |
          cd dist
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.tar.gz
            dist/${{ matrix.name }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create combined checksums
        run: |
          cd release
          cat *.sha256 > checksums.txt

      - name: Update version in package.json
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ env.VERSION }}"/' package.json

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: v$VERSION" || true
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: release/*
          generate_release_notes: true

